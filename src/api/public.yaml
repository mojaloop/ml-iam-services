openapi: 3.1.0
info:
  title: IAM
  version: 1.0.0
  description: >-
    What people and the UIs they use ask of the IAM, through the gateway: the
    catalog of permissions, the roles composed from them, the resources roles
    are granted over, who holds what, and which permissions the caller holds.
    Every operation is a permission like any other service's, so who may
    compose roles or assign them is itself a grant. Writing a role or handing
    one out is limited to what the caller holds, or to what the operation's
    scope names.

servers:
  - url: /

x-authz:
  resourceTypes: [roles, permissions]

components:
  schemas:
    Localized:
      description: Display text, a string or one per language.
      oneOf:
        - type: string
        - type: object
          additionalProperties:
            type: string
    ResourceSet:
      description: >-
        $all for every resource of the name, present and future; one id; or a
        list of ids. Only the IAM's own words start with $, and no id holds ,
        or ;.
      oneOf:
        - type: string
          const: $all
        - type: string
          pattern: '^[^$,;][^,;]*$'
        - type: array
          minItems: 1
          items:
            type: string
            pattern: '^[^$,;][^,;]*$'
    Grant:
      type: object
      required: [permission]
      additionalProperties: false
      properties:
        permission:
          type: string
          minLength: 1
        resources:
          description: Per resource name the permission is scoped by; one left out is the assignment's to name.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ResourceSet'
    RoleSpec:
      type: object
      required: [grants]
      additionalProperties: false
      properties:
        title:
          $ref: '#/components/schemas/Localized'
        description:
          $ref: '#/components/schemas/Localized'
        grants:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Grant'
    NewRole:
      type: object
      required: [name, grants]
      additionalProperties: false
      properties:
        name:
          description: Lowercase letters, digits and '-', unique across the deployment.
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 63
        title:
          $ref: '#/components/schemas/Localized'
        description:
          $ref: '#/components/schemas/Localized'
        grants:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Grant'
    Role:
      type: object
      required: [name, grants, open, owner]
      properties:
        name:
          type: string
        title:
          $ref: '#/components/schemas/Localized'
        description:
          $ref: '#/components/schemas/Localized'
        heldBy:
          type: string
          enum: [authenticated]
        grants:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
        open:
          description: The resource names an assignment of this role must name.
          type: array
          items:
            type: string
        owner:
          description: iam for a role composed here, which this API may change; deployment for one applied by the deployment, which it may not.
          type: string
          enum: [iam, deployment]
        ready:
          description: What the IAM made of the role; absent until it has read it.
          allOf:
            - $ref: '#/components/schemas/Verdict'
    Verdict:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [Accepted, Refused, Waiting]
        message:
          type: string
    Assignment:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          type: string
          minLength: 1
        resources:
          description: One id, or $all, per resource name the role leaves open.
          type: object
          additionalProperties:
            type: string
            minLength: 1
    Held:
      type: object
      required: [role, resources, through]
      properties:
        role:
          type: string
        resources:
          type: object
          additionalProperties:
            type: string
        through:
          description: assigned, or authenticated for a role every signed-in subject holds.
          type: string
          enum: [assigned, authenticated]
    Subject:
      type: object
      required: [id, kind]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [person, client]
        name:
          type: string
        email:
          type: string
    Resource:
      type: object
      required: [resourceName, id]
      properties:
        resourceName:
          type: string
        id:
          type: string
    CatalogPermission:
      type: object
      required: [id, operationId, method, path, deprecated, scopedBy, bound, resourceNames]
      properties:
        id:
          description: The permission, as grants name it.
          type: string
        operationId:
          type: string
        summary:
          description: What the operation does, the label a UI shows.
          type: string
        method:
          type: string
        path:
          type: string
        deprecated:
          type: boolean
        scopedBy:
          description: The service's resource types the operation is about.
          type: array
          items:
            type: string
        bound:
          description: The ones its path carries an id for.
          type: array
          items:
            type: string
        resourceNames:
          description: The deployment's resource name for each type, which grants and assignments speak in.
          type: object
          additionalProperties:
            type: string
    ServiceCatalog:
      type: object
      required: [service, title, permissions]
      properties:
        service:
          type: string
        title:
          type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/CatalogPermission'
    ResourceName:
      type: object
      required: [members]
      properties:
        label:
          $ref: '#/components/schemas/Localized'
        description:
          $ref: '#/components/schemas/Localized'
        own:
          description: >-
            The IAM's own resource name, roles or permissions, whose ids are
            deployment data a role may name. A role fixes every other name to
            $all or leaves it to the assignment.
          type: boolean
          const: true
        members:
          type: array
          items:
            type: object
            required: [service, type]
            properties:
              service:
                type: string
              type:
                type: string
    Instance:
      type: object
      required: [instance]
      properties:
        instance:
          description: The role instance, as the IAM names it.
          type: string
    State:
      type: object
      required: [services, roles, separations, pending, renamed, removed]
      properties:
        services:
          type: array
          items:
            type: object
            required: [service, permissions]
            properties:
              service:
                type: string
              permissions:
                type: integer
        roles:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
              ready:
                $ref: '#/components/schemas/Verdict'
        separations:
          type: array
          items:
            type: object
            required: [name, violations]
            properties:
              name:
                type: string
              ready:
                $ref: '#/components/schemas/Verdict'
              violations:
                description: Subjects who already break the rule.
                type: array
                items:
                  type: string
        pending:
          description: What waits for a service no route has brought yet.
          type: array
          items:
            type: string
        renamed:
          description: Permissions a service renamed, by their old name; grants under an old name hold under the new one.
          type: object
          additionalProperties:
            type: string
        removed:
          description: Permissions a service removed; their grants are dropped.
          type: array
          items:
            type: string
        applied:
          description: What the last apply wrote, absent until the first.
          type: object
          properties:
            at:
              type: string
            roles:
              type: integer
            inserted:
              type: integer
            deleted:
              type: integer
    Problems:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: string

  responses:
    Unauthenticated:
      description: The request carries no session or token the IAM can read a caller from
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problems'
    Refused:
      description: Refused, with the reasons
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problems'
    Invalid:
      description: The request does not match this operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problems'

paths:
  /health:
    get:
      operationId: getHealth
      summary: Reports whether the API is running
      x-authz:
        internal: true
      responses:
        '200':
          description: The API is running

  /catalog:
    get:
      operationId: getCatalog
      summary: Lists every permission the deployment's services offer
      x-authz:
        scopedBy: []
      responses:
        '200':
          description: One entry per service, each with its permissions and their summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceCatalog'

  /resource-names:
    get:
      operationId: getResourceNames
      summary: Lists the deployment's resource names
      x-authz:
        scopedBy: []
      responses:
        '200':
          description: Every resource name with its label, description and members, keyed by its name
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/ResourceName'

  /resources:
    get:
      operationId: listResources
      summary: Lists the resources that exist, to choose among
      x-authz:
        scopedBy: [$resources]
      parameters:
        - name: resourceName
          in: query
          required: false
          schema:
            type: string
      description: >-
        What the provisioning authority recorded, and what each resource
        name's declared source lists, read for this request, of what the
        caller's scope reaches. A
        source that does not answer is named in `stale-sources`, and its last
        good read stands in for it.
      responses:
        '200':
          description: The resources, optionally of one resource name
          headers:
            stale-sources:
              description: The resource names whose source did not answer, answered from their last good read
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Resource'

  /roles:
    get:
      operationId: listRoles
      summary: Lists the roles, what each leaves open and who owns it
      x-authz:
        scopedBy: [roles]
      responses:
        '200':
          description: The roles the caller's scope names
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
    post:
      operationId: createRole
      summary: Composes a new role
      description: >-
        Every grant must be one the caller holds over the resources it fixes,
        or one whose permission this operation's scope names, fixed no wider
        than the scope reaches of each resource name. A resource name a grant
        leaves for the assignment passes either way.
      x-authz:
        scopedBy: [permissions, $resources]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRole'
      responses:
        '201':
          description: The role, as the IAM now holds it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Refused'
        '422':
          $ref: '#/components/responses/Refused'

  /roles/{role}:
    parameters:
      - name: role
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getRole
      summary: Reads one role
      x-authz:
        scopedBy: [{ roles: role }]
      responses:
        '200':
          description: The role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '404':
          $ref: '#/components/responses/Refused'
    put:
      operationId: updateRole
      summary: Changes a role composed here
      description: >-
        Only a role the IAM owns changes here; one the deployment applied
        changes where the deployment keeps it. Every grant must be one the
        caller holds over the resources it fixes, or one whose permission this
        operation's scope names, fixed no wider than the scope reaches of each
        resource name. A resource name a grant leaves for the assignment
        passes either way.
      x-authz:
        scopedBy: [{ roles: role }, permissions, $resources]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleSpec'
      responses:
        '200':
          description: The role, as the IAM now holds it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/Refused'
        '409':
          $ref: '#/components/responses/Refused'
        '422':
          $ref: '#/components/responses/Refused'
    delete:
      operationId: deleteRole
      summary: Deletes a role composed here
      x-authz:
        scopedBy: [{ roles: role }]
      responses:
        '204':
          description: The role is gone, and nobody holds it
        '404':
          $ref: '#/components/responses/Refused'
        '409':
          $ref: '#/components/responses/Refused'

  /subjects:
    get:
      operationId: listSubjects
      summary: Lists the people and machine clients that can hold roles
      x-authz:
        scopedBy: []
      responses:
        '200':
          description: Every subject
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subject'

  /subjects/{subject}/assignments:
    parameters:
      - name: subject
        in: path
        required: true
        description: A person's identity id or a machine client's id
        schema:
          type: string
    get:
      operationId: getAssignments
      summary: Lists what one subject holds
      x-authz:
        scopedBy: []
      responses:
        '200':
          description: One entry per role instance, the ones every signed-in subject holds included
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Held'
    post:
      operationId: assignRole
      summary: Gives a subject a role
      description: >-
        Names one resource, or $all, per resource name the role leaves open.
        Everything the role then gives must be held by the caller, unless this
        operation's scope names the role and reaches every resource the
        assignment names. Refused when it would leave the subject holding two
        groups of a separation rule.
      x-authz:
        scopedBy: [roles, $resources]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Assignment'
      responses:
        '200':
          description: The role instance the subject now holds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/Refused'
    delete:
      operationId: unassignRole
      summary: Takes a role from a subject
      x-authz:
        scopedBy: [roles, $resources]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Assignment'
      responses:
        '200':
          description: The role instance the subject no longer holds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/Refused'

  /state:
    get:
      operationId: getState
      summary: Reports what the IAM applied, what waits and what it refused
      x-authz:
        scopedBy: []
      responses:
        '200':
          description: The composition, every role and rule with its verdict, and holdings that break a rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'

  /changes:
    get:
      operationId: getChanges
      summary: Streams a notice each time what the IAM applied changes
      description: >-
        Server-sent events. Each `composition` event carries the ETag of what
        the IAM now holds, as its id and in its data: the catalog, the roles
        and rules with their verdicts, and what waits. The first one is sent
        on connecting, unless `Last-Event-ID` names it already, so a client
        reconnecting after a dropped stream learns of what it missed.
      x-authz:
        scopedBy: []
      responses:
        '200':
          description: The stream
          content:
            text/event-stream:
              schema:
                type: string
