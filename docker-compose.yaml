services:
  keto:
    image: oryd/keto:v26.2.0
    command: serve -c /etc/keto/config.yaml
    volumes:
      - ./docker/keto.yaml:/etc/keto/config.yaml:ro
    ports:
      - "4466:4466"
      - "4467:4467"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4466/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 5

  hydra:
    image: oryd/hydra:v26.2.0
    command: serve all --dev
    environment:
      DSN: memory
      URLS_SELF_ISSUER: http://localhost:4444/
      SECRETS_SYSTEM: integration-tests-only-system-secret
    ports:
      - "4444:4444"
      - "4445:4445"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4445/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 5

  kratos:
    image: oryd/kratos:v26.2.0
    command: serve -c /etc/kratos/config.yaml --dev --watch-courier
    volumes:
      - ./docker/kratos.yaml:/etc/kratos/config.yaml:ro
      - ./docker/identity.schema.json:/etc/kratos/identity.schema.json:ro
    ports:
      - "4433:4433"
      - "4434:4434"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4434/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 5
